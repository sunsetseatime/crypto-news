name: Daily Scan (Pages)

on:
  workflow_dispatch:
    inputs:
      skip_defi:
        description: "Skip DeFi scan (src/defi_scan.js)"
        type: boolean
        default: false
  schedule:
    # GitHub Actions schedules are in UTC. 07:00/19:00 SAST (UTC+2) = 05:00/17:00 UTC.
    - cron: "0 5,17 * * *"

concurrency:
  group: crypto-news-pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

env:
  # Match your locale for report timestamps (e.g., Summary.md uses toLocaleString()).
  TZ: Africa/Johannesburg
  # API usage controls (CoinGecko quota)
  CACHE_TTL_MINUTES: "1440"
  SIGNAL_ENGINE_CACHE_TTL_MINUTES: "1440"
  DEFI_CACHE_TTL_MINUTES: "1440"
  DEFI_STALE_HOURS: "168"
  AUTO_RUN_DEFI: "0"
  SKIP_MARKET_OHLC: "1"
  DISCOVER_MARKET_PAGES: "3"
  DEFI_ENABLE_ONCHAIN: "0"
  DEFI_TOP_DEV_FETCH_LIMIT: "5"
  DEFI_TOP_ONCHAIN_FETCH_LIMIT: "0"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Prepare state directories
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/backtest reports/defi/snapshots reports/history/watchlist reports/history/signal_engine reports/paper reports/signal_engine/cache

      - name: Restore state cache (history/backtest/queue)
        uses: actions/cache@v4
        with:
          path: |
            config/discovery_queue.json
            reports/Dashboard.html
            reports/Summary.md
            reports/Layer1Report.json
            reports/Alerts.md
            reports/Alerts.json
            reports/DiffReport.json
            reports/SupervisorSummary.json
            reports/DiscoveryReport.md
            reports/DiscoveryReport.json
            reports/backtest
            reports/defi/Latest.md
            reports/defi/Latest.json
            reports/defi/snapshots
            reports/history/watchlist
            reports/history/signal_engine
            reports/paper
            reports/signal_engine/SignalEngine.md
            reports/signal_engine/SignalEngine.json
            reports/signal_engine/signal_engine_candidate_suggestions.json
            reports/signal_engine/signal_engine_projects.pending.json
            reports/signal_engine/cache
          key: crypto-news-state-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            crypto-news-state-${{ runner.os }}-${{ github.ref_name }}-

      - name: Run discovery
        env:
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          COINGECKO_API_KEY_HEADER: ${{ secrets.COINGECKO_API_KEY_HEADER }}
          COINGECKO_BASE_URL: ${{ secrets.COINGECKO_BASE_URL }}
        run: node src/discover.js

      - name: Run Signal Engine (fundamentals)
        shell: bash
        run: |
          set +e
          log_file="$(mktemp)"
          node src/signal_engine.js 2>&1 | tee "$log_file"
          code=${PIPESTATUS[0]}
          set -e

          if [ "$code" -ne 0 ] && grep -q "CoinGecko error 10006" "$log_file"; then
            echo "::warning title=Signal Engine skipped::CoinGecko monthly quota exhausted (10006). Reusing cached Signal Engine outputs if available."
            exit 0
          fi

          exit "$code"

      - name: Run DeFi scan
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.skip_defi != 'true' }}
        shell: bash
        env:
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          COINGECKO_API_KEY_HEADER: ${{ secrets.COINGECKO_API_KEY_HEADER }}
          COINGECKO_BASE_URL: ${{ secrets.COINGECKO_BASE_URL }}
        run: |
          set +e
          log_file="$(mktemp)"
          node src/defi_scan.js 2>&1 | tee "$log_file"
          code=${PIPESTATUS[0]}
          set -e

          if [ "$code" -ne 0 ] && grep -q "CoinGecko error 10006" "$log_file"; then
            echo "::warning title=DeFi scan skipped::CoinGecko monthly quota exhausted (10006). Reusing cached DeFi outputs if available."
            exit 0
          fi

          exit "$code"

      - name: Run watchlist scan
        shell: bash
        env:
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          COINGECKO_API_KEY_HEADER: ${{ secrets.COINGECKO_API_KEY_HEADER }}
          COINGECKO_BASE_URL: ${{ secrets.COINGECKO_BASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL_SUPERVISOR: ${{ secrets.OPENAI_MODEL_SUPERVISOR }}
          ETHPLORER_API_KEY: ${{ secrets.ETHPLORER_API_KEY }}
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
          BSCSCAN_API_KEY: ${{ secrets.BSCSCAN_API_KEY }}
          POLYGONSCAN_API_KEY: ${{ secrets.POLYGONSCAN_API_KEY }}
          ARBISCAN_API_KEY: ${{ secrets.ARBISCAN_API_KEY }}
          OPTIMISM_API_KEY: ${{ secrets.OPTIMISM_API_KEY }}
          BASESCAN_API_KEY: ${{ secrets.BASESCAN_API_KEY }}
          COVALENT_API_KEY: ${{ secrets.COVALENT_API_KEY }}
        run: |
          set +e
          log_file="$(mktemp)"
          node src/index.js 2>&1 | tee "$log_file"
          code=${PIPESTATUS[0]}
          set -e

          if [ "$code" -ne 0 ] && grep -q "CoinGecko error 10006" "$log_file"; then
            echo "::warning title=Watchlist scan skipped::CoinGecko monthly quota exhausted (10006). Reusing cached watchlist outputs if available."
            exit 0
          fi

          exit "$code"

      - name: Prune state (keep caches small)
        shell: bash
        run: |
          set -euo pipefail

          # Keep last 60 watchlist runs (each run writes multiple files with the same prefix).
          if [ -d "reports/history/watchlist" ]; then
            mapfile -t layer1 < <(ls -1 "reports/history/watchlist"/*_Layer1Report.json 2>/dev/null | sort -r || true)
            if [ "${#layer1[@]}" -gt 60 ]; then
              for old in "${layer1[@]:60}"; do
                prefix="${old%_Layer1Report.json}"
                rm -f "${prefix}_Layer1Report.json" \
                      "${prefix}_Summary.md" \
                      "${prefix}_DiffReport.json" \
                      "${prefix}_Dashboard.html" \
                      "${prefix}_SupervisorSummary.json" \
                      "${prefix}_Alerts.json" \
                      "${prefix}_Alerts.md" || true
              done
            fi
          fi

          # Keep last 60 DeFi snapshots.
          if [ -d "reports/defi/snapshots" ]; then
            mapfile -t snaps < <(ls -1 "reports/defi/snapshots"/*.json 2>/dev/null | sort -r || true)
            if [ "${#snaps[@]}" -gt 60 ]; then
              for old in "${snaps[@]:60}"; do
                rm -f "$old" || true
              done
            fi
          fi

          # Keep last 60 Signal Engine runs.
          if [ -d "reports/history/signal_engine" ]; then
            mapfile -t runs < <(ls -1 "reports/history/signal_engine"/*_SignalEngine.json 2>/dev/null | sort -r || true)
            if [ "${#runs[@]}" -gt 60 ]; then
              for old in "${runs[@]:60}"; do
                rm -f "$old" || true
              done
            fi
          fi

      - name: Build Pages site (latest reports)
        shell: bash
        run: |
          set -euo pipefail
          rm -rf site
          mkdir -p site/backtest site/defi site/paper site/signal_engine

          # Dashboard
          if [ -f "reports/Dashboard.html" ]; then
            cp "reports/Dashboard.html" "site/Dashboard.html"
            cp "reports/Dashboard.html" "site/index.html"
          else
            printf '%s\n' "<!doctype html><meta charset='utf-8'><title>Crypto Scanner</title><p>No dashboard generated.</p>" > "site/index.html"
          fi

          # Core report files (copy if present)
          for f in \
            "Summary.md" \
            "Layer1Report.json" \
            "Alerts.md" \
            "Alerts.json" \
            "DiffReport.json" \
            "SupervisorSummary.json" \
            "DiscoveryReport.md" \
            "DiscoveryReport.json"
          do
            if [ -f "reports/$f" ]; then
              cp "reports/$f" "site/$f"
            fi
          done

          # Signal Engine (fundamentals)
          if [ -f "reports/signal_engine/SignalEngine.md" ]; then
            cp "reports/signal_engine/SignalEngine.md" "site/signal_engine/SignalEngine.md"
          fi
          if [ -f "reports/signal_engine/SignalEngine.json" ]; then
            cp "reports/signal_engine/SignalEngine.json" "site/signal_engine/SignalEngine.json"
          fi
          if [ -f "reports/signal_engine/signal_engine_candidate_suggestions.json" ]; then
            cp "reports/signal_engine/signal_engine_candidate_suggestions.json" "site/signal_engine/signal_engine_candidate_suggestions.json"
          fi
          if [ -f "reports/signal_engine/signal_engine_projects.pending.json" ]; then
            cp "reports/signal_engine/signal_engine_projects.pending.json" "site/signal_engine/signal_engine_projects.pending.json"
          fi

          # Backtest + DeFi (copy if present)
          if [ -f "reports/backtest/BacktestReport.md" ]; then
            cp "reports/backtest/BacktestReport.md" "site/backtest/BacktestReport.md"
          fi
          if [ -f "reports/backtest/BacktestReport.json" ]; then
            cp "reports/backtest/BacktestReport.json" "site/backtest/BacktestReport.json"
          fi
          if [ -f "reports/defi/Latest.md" ]; then
            cp "reports/defi/Latest.md" "site/defi/Latest.md"
          fi
          if [ -f "reports/defi/Latest.json" ]; then
            cp "reports/defi/Latest.json" "site/defi/Latest.json"
          fi
          if [ -f "reports/paper/PaperReport.md" ]; then
            cp "reports/paper/PaperReport.md" "site/paper/PaperReport.md"
          fi
          if [ -f "reports/paper/PaperReport.json" ]; then
            cp "reports/paper/PaperReport.json" "site/paper/PaperReport.json"
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Upload site artifact (downloadable)
        uses: actions/upload-artifact@v4
        with:
          name: crypto-news-site
          path: site
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build
    # Public repos deploy automatically.
    # For private repos (paid plans where Pages is enabled), set repo variable ENABLE_PAGES=1.
    if: ${{ vars.ENABLE_PAGES == '1' || github.event.repository.private == false }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
